name: 🚀 Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      tag: ${{ steps.semantic.outputs.tag }}
    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: 🔧 Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📦 Install
        run: npm ci

      - name: 🚀 Semantic Release
        id: semantic
        run: |
          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          npx semantic-release
          new="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$new" ] && [ "$prev" != "$new" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$new" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: 🏗️ Build Packages (${{ matrix.branch }})
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        branch: [ openwrt-24.10, openwrt-25.12 ]
    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: 🏗️ Build Package
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434 # main
        env:
          ARCH: aarch64_generic-${{ matrix.branch }}
          FEEDNAME: bits
          PACKAGES: luci-app-bitstailscale
          NO_REFRESH_CHECK: true
          KEY_BUILD: ${{ matrix.branch == 'openwrt-24.10' && secrets.KEY_BUILD || '' }}
          PRIVATE_KEY: ${{ matrix.branch == 'openwrt-25.12' && secrets.APK_PRIVATE_KEY || '' }}

      - name: 📤 Attach Packages
        run: |
          find bin/packages -path '*/bits/*' \( -name '*.ipk' -o -name '*.apk' \) \
            -exec gh release upload "${{ needs.release.outputs.tag }}" {} --clobber \;
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  feed:
    name: 🔔 Trigger Feed
    needs: [release, build]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🔔 Trigger Feed
        run: |
          gh api repos/Banten-IT-Solutions/BITS-WRT-Packages/dispatches \
            -f event_type=release-update \
            -f client_payload[repo]=BITS-Tailscale \
            -f client_payload[version]="${{ needs.release.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.FEED_PAT }}